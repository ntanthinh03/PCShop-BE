name: CI - Build & Push Docker Image

concurrency:
  group: ci-docker-${{ github.event.inputs.target_env || 'manual' }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Môi trường triển khai (uat / prod)'
        required: true
        default: 'uat'
        type: choice
        options:
          - 'uat'
          - 'prod'
      skip_tests:
        description: 'Bỏ qua test gate (CHỈ dùng cho hotfix khẩn cấp)'
        type: boolean
        default: false
      push_dockerhub:
        description: 'Push lên Docker Hub'
        type: boolean
        default: false
      push_ghcr:
        description: 'Push lên GitHub Container Registry (GHCR)'
        type: boolean
        default: true
      image_tag:
        description: 'Docker tag tùy chọn (để trống = tự sinh theo env)'
        required: false
        default: ''
        type: string
      runner:
        description: 'Runner'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - 'ubuntu-latest'
          - 'self-hosted'

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pcshop-be
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ==========================================
  # 1. Prepare: Xác định version, tags, metadata
  # ==========================================
  prepare:
    name: Prepare Metadata & Tag
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.version.outputs.sha_short }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Version & Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/heads/release/ ]]; then
            VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/heads\/release\///g' | sed 's/[^0-9.]//g')
          elif [[ "${{ github.ref }}" =~ ^refs/heads/hotfix/ ]]; then
            VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/heads\/hotfix\///g' | sed 's/[^0-9.]//g')
          else
            VERSION=$(date +'%y%m%d')
          fi
          
          SHA_SHORT=$(git rev-parse --short HEAD)
          TARGET_ENV="${{ github.event.inputs.target_env }}"

          # uat: tag cố định "uat" để deploy rolling
          # prod: tag theo build number để dễ rollback
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "$TARGET_ENV" == "prod" ]]; then
            IMAGE_TAG="${{ github.run_number }}"
          else
            IMAGE_TAG="uat"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "📋 Tag: $IMAGE_TAG (Version: $VERSION, SHA: $SHA_SHORT)"

      - name: Environment Mapping
        id: env
        run: |
          if [[ "${{ github.event.inputs.target_env }}" == "prod" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  # ==========================================
  # 2. Test Gate: Chạy trước khi đóng Image
  # ==========================================
  test:
    name: Test Gate
    if: github.event.inputs.skip_tests != 'true'
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo, sqlite3, pdo_sqlite, bcmath, gd, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare Laravel Environment
        run: cp .env.example .env

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          php artisan key:generate
          php artisan package:discover --ansi
          php artisan test

  # ==========================================
  # 3. Build & Push Docker Image
  # ==========================================
  build-and-push:
    name: Build & Push Image
    needs: [prepare, test]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Warning if test skipped
        if: needs.test.result == 'skipped'
        run: |
          echo "::warning::Image này được build với SKIP_TESTS=true!"
          echo "## ⚠️ Cảnh báo: Test gate đã bị bỏ qua" >> $GITHUB_STEP_SUMMARY

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event.inputs.push_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event.inputs.push_ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Tags
        id: meta
        run: |
          TAG="${{ needs.prepare.outputs.image_tag }}"
          TAGS=""
          
          if [[ "${{ github.event.inputs.push_ghcr }}" == "true" ]]; then
            TAGS+="${{ env.GHCR_IMAGE }}:${TAG}"$'\n'
            # Thêm latest nếu là prod
            if [[ "${{ github.event.inputs.target_env }}" == "prod" ]]; then
              TAGS+="${{ env.GHCR_IMAGE }}:latest"$'\n'
            fi
          fi

          if [[ "${{ github.event.inputs.push_dockerhub }}" == "true" ]]; then
            TAGS+="${{ env.DOCKERHUB_IMAGE }}:${TAG}"$'\n'
            if [[ "${{ github.event.inputs.target_env }}" == "prod" ]]; then
              TAGS+="${{ env.DOCKERHUB_IMAGE }}:latest"$'\n'
            fi
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -n "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha,scope=pcshop-be
          cache-to: type=gha,mode=max,scope=pcshop-be
          provenance: false
          build-args: |
            ENVIRONMENT=${{ needs.prepare.outputs.environment }}
            VERSION=${{ needs.prepare.outputs.version }}
            SHA_SHORT=${{ needs.prepare.outputs.sha_short }}

  # ==========================================
  # 4. Summary: Hiển thị tóm tắt sau build
  # ==========================================
  summary:
    name: Build Summary
    needs: [prepare, test, build-and-push]
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    if: always()
    steps:
      - name: Report Summary
        run: |
          {
            echo "## 🚀 PCShop-BE Docker Build Summary"
            echo ""
            echo "- **Môi trường:** \`${{ github.event.inputs.target_env }}\`"
            echo "- **Version:** \`${{ needs.prepare.outputs.version }}\`"
            echo "- **Commit SHA:** \`${{ needs.prepare.outputs.sha_short }}\`"
            echo "- **Image Tag:** \`${{ needs.prepare.outputs.image_tag }}\`"
            echo "- **Trạng thái Test Gate:** \`${{ needs.test.result }}\`"
            echo "- **Trạng thái Build:** \`${{ needs.build-and-push.result }}\`"
          } >> $GITHUB_STEP_SUMMARY
